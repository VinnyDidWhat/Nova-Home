name: Build NOVA Home APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Home-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish NOVA Home v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" NOVA-Home-v1.0.0.apk
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 NOVA-Home-v1.0.0.apk --clobber
          else
            gh release create v1.0.0 NOVA-Home-v1.0.0.apk --target "$GITHUB_SHA" --title "NOVA Home v1.0.0" --notes "Initial Android TV / Google TV launcher preview. Install the APK on your TV. This is a debug-signed test build; replacing the system Google TV Home launcher is not guaranteed."
          fi
